# Publishes the OpenVM execution harness as a container image.
#
# OpenVM ships no image at all - cargo-openvm is a source install - and the
# CLI's `run` takes a transpiled .vmexe, not an ELF. So anything that wants to
# RUN a bflat guest has to build the SDK from source, which is the long pole in
# any job that touches it. This publishes it once.
#
# The revision is on the rv64 line (branch develop-v2.1.0); `main` is still
# rv32 and rejects a 64-bit ELF outright. Pinned to a commit so the image is
# reproducible.
#
# Published to Docker Hub, alongside the other images the guests use
# (nethermindeth/zisk, nethermindeth/bflat-riscv64). Needs DOCKER_HUB_USERNAME
# and DOCKER_HUB_PASSWORD in this repository or granted to it from the org; the
# preflight step below says so plainly instead of letting the login step fail
# with a bare "Username and password required".
#
# Manual only. After publishing, pin the new digest in the consumers
# (nethermind's Nethermind.Stateless.OpenVmGuest/Makefile, OPENVM_IMAGE).
name: Release OpenVM runner

on:
  workflow_dispatch:
    inputs:
      openvm_rev:
        description: OpenVM commit on the rv64 line to build the harness from
        type: string
        default: 56d5e4dbb545662f7ba3c31ac6c3e0ab1c6a481d
      image_tag:
        description: Image tag
        type: string
        default: v2.1.0-rv64
      push:
        description: Push to Docker Hub (off = build only, to check it compiles)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runner:
    name: openvm-runner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check the Docker Hub credentials are present
        if: inputs.push
        env:
          USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          [ -n "$USERNAME" ] && [ -n "$PASSWORD" ] || {
            echo "::error::DOCKER_HUB_USERNAME / DOCKER_HUB_PASSWORD are not set for this repository. Add them, or run with push off to build only."
            exit 1
          }

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: runner
          build-args: OPENVM_REV=${{ inputs.openvm_rev }}
          push: ${{ inputs.push }}
          tags: nethermindeth/openvm-runner:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest to pin
        if: inputs.push
        run: |
          echo "### Pin this in the consumers" >> "$GITHUB_STEP_SUMMARY"
          echo '```make' >> "$GITHUB_STEP_SUMMARY"
          echo "OPENVM_IMAGE ?= nethermindeth/openvm-runner:${{ inputs.image_tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
