name: Build and publish NuGet package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bflat_ref:
        description: bflat-riscv64 ref to build the linker against
        default: feature/new_zkvms
        type: string
      publish:
        description: Publish to NuGet
        default: "No"
        type: choice
        options:
          - "No"
          - Staging
          - Production
      openvm_ref:
        description: OpenVM version the package is labelled with
        type: string
        default: v2.1.0

env:
  # push and pull_request runs have no inputs; they get the default.
  OPENVM_REF: ${{ inputs.openvm_ref || 'v2.1.0' }}

permissions:
  contents: read

jobs:
  build-libopenvm:
    name: Build libopenvm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-linux-gnu

      - name: Install the Rust nightly toolchain
        # build-std needs nightly plus rust-src: the accelerator staticlib is
        # built for a custom bare-metal target that ships no prebuilt core.
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup run nightly rustc --version

      - name: Check the generated secp256k1 tables
        run: python3 src/accel-rs/gen_tables.py --check

      - name: Test secp256k1 recovery on the host
        # Fails on any curve operation the OpenVM chips would not prove, and
        # diffs every result against a Python reference.
        run: python3 tests/secp256k1/test_ecrecover.py

      - name: Build static library
        run: ./build/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libopenvm
          path: |
            output/libopenvm.a
            output/libopenvm.bflat.manifest
            output/openvm_entry.o
            output/openvm.ld
            output/openvm.bflat.manifest
          if-no-files-found: error

  platform-tests:
    # platform/entry.S, the bflat entry point of the guest: _start for the
    # OpenVM entry, and the 64-bit memcpy/memmove/memset, cross-compiled and run under
    # qemu-user. The tests came here from bflat-riscv64 with the entry point.
    name: Platform unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the RISC-V toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user-static

      - name: Build the platform files
        run: platform/build.sh

      - name: Run the unit tests
        run: tests/platform/run.sh

  link-guest:
    # The surface check in build-libopenvm proves the symbols exist. This proves
    # they LINK: a real bflat guest, built for --libc openvm against the real
    # linker script, calling all 21 entry points through direct P/Invoke. It is
    # the step that catches a symbol colliding with musl or with the guest's own
    # entry point - the failure mode the localization in build/build.sh exists
    # to prevent, and one no amount of nm-ing the archive can rule out.
    name: Link a real bflat guest
    needs: build-libopenvm
    runs-on: ubuntu-latest
    container:
      # 24.04, not 26.04: bflat's bundled lld is linked against ICU 74, and
      # 26.04 ships 78 with no compatible soname. bflat-riscv64's own CI does
      # not hit this because it runs bflat from its packaged Docker image.
      image: ubuntu:24.04
    steps:
      - name: Install the toolchain
        run: |
          apt-get update
          apt-get install -y git gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
                             binutils-riscv64-linux-gnu llvm clang lld xxd \
                             python3 python3-pip wget curl ca-certificates yq libicu-dev
          pip3 install lief pyelftools --break-system-packages
          # The riscv64 cross-gcc ships only hard-float (lp64d) glibc stubs;
          # bflat's native modules are compiled -mabi=lp64.
          touch /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

      - name: Install .NET
        run: |
          wget -q https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
          ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV
          echo "/usr/share/dotnet" >> $GITHUB_PATH

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: bflat-openvm

      - name: Check out bflat-riscv64
        uses: actions/checkout@v4
        with:
          repository: NethermindEth/bflat-riscv64
          ref: ${{ inputs.bflat_ref || 'feature/new_zkvms' }}
          path: bflat-riscv64

      - name: Download the libopenvm artifact
        uses: actions/download-artifact@v4
        with:
          name: libopenvm
          path: bflat-openvm/output

      - name: Build bflat and its native modules
        working-directory: bflat-riscv64
        # The modules leg produces the lib/modules that the OpenVM platform
        # requires. The platform itself - entry point and memory map - is in
        # this repository's output/ (platform/build.sh), next to libopenvm,
        # and --extlib reads both manifests from there.
        run: |
          ./build.sh modules riscv64 perf 10
          ./build.sh bflat riscv64 perf 10

      - name: Link the guest against libopenvm
        run: |
          set -e
          cp bflat-openvm/bflat-manifest.json bflat-openvm/output/libopenvm.bflat.manifest
          bflat-riscv64/src/bflat/bin/Debug/net10.0/bflat build \
            bflat-openvm/tests/integration/guest.cs \
            --os linux --arch riscv64 --libc openvm --stdlib dotnet \
            --no-pie --no-pthread -Ot \
            --extlib "$PWD/bflat-openvm/output/libopenvm.bflat.manifest" \
            -o guest
          riscv64-linux-gnu-readelf -h guest | grep -E 'Class:|Machine:|Entry point'
          ls -la guest
          bflat-riscv64/src/bflat/bin/Debug/net10.0/bflat build \
            bflat-openvm/tests/integration/u256.cs \
            --os linux --arch riscv64 --libc openvm --stdlib dotnet \
            --no-pie --no-pthread -Ot \
            --extlib "$PWD/bflat-openvm/output/libopenvm.bflat.manifest" \
            -o u256
          bflat-riscv64/src/bflat/bin/Debug/net10.0/bflat build             bflat-openvm/tests/secp256k1/guest.cs             --os linux --arch riscv64 --libc openvm --stdlib dotnet             --no-pie --no-pthread -Ot             --extlib "$PWD/bflat-openvm/output/libopenvm.bflat.manifest"             -o secp256k1-guest

      - name: Upload the linked guests
        # Keeping the image makes an "N instructions the VM cannot decode"
        # report something you can go and disassemble, instead of a number.
        uses: actions/upload-artifact@v4
        with:
          name: integration-guest
          path: |
            guest
            u256
            secp256k1-guest

      - name: Check the linked image
        # --no-atomics is now enforced: bflat's nothread module displaces the
        # musl primitives whose lr/sc/amo* used to leave 128 of them in the
        # image. OpenVM emits `unimp` for a word it cannot decode and traps
        # only if execution reaches it, so one reappearing would be a landmine
        # rather than a load failure - which is exactly why it is worth failing
        # the build over.
        run: |
          python3 bflat-openvm/tests/integration/check_image.py guest --require-custom --no-atomics

  run-u256-vectors:
    # guest.cs only links the u256 shims; this executes them. A wrong funct7 or
    # register order in openvm_intrinsics.S links fine and computes the wrong
    # thing, so the vector guest runs on the OpenVM runner and must report zero
    # mismatches over its 444 checks.
    name: Run the u256 vectors on OpenVM
    needs: [link-guest, run-divrem-vectors]
    runs-on: ubuntu-latest
    env:
      OPENVM_IMAGE: openvm-divrem-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the linked guests
        uses: actions/download-artifact@v4
        with:
          name: integration-guest
          path: guests

      - name: Load the runner image
        uses: actions/download-artifact@v4
        with:
          name: openvm-runner

      - name: Load the runner
        run: gunzip -c openvm-runner.tar.gz | docker load

      - name: Execute the vector guest
        run: |
          : > guests/empty.raw
          out=$(docker run --rm -v "$PWD/guests:/n" "$OPENVM_IMAGE" /n/u256 /n/empty.raw | tail -1)
          echo "$out"
          # Mismatches, then checks, as little-endian u64s.
          [ "$out" = "public_values=0000000000000000bc0100000000000000000000000000000000000000000000" ] \
            || { echo "::error::u256 vectors failed: $out"; exit 1; }

  run-secp256k1-guest:
    # The host test emulates the chips' preconditions; this runs the recovery
    # on OpenVM itself, against the same reference, adversarial vectors
    # included.
    name: Run secp256k1 recovery on OpenVM
    needs: [link-guest, run-divrem-vectors]
    runs-on: ubuntu-latest
    env:
      OPENVM_IMAGE: openvm-divrem-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the linked guests
        uses: actions/download-artifact@v4
        with:
          name: integration-guest
          path: guests

      - name: Load the runner image
        uses: actions/download-artifact@v4
        with:
          name: openvm-runner

      - name: Load the runner
        run: gunzip -c openvm-runner.tar.gz | docker load

      - name: Run the vectors
        run: |
          expected=$(python3 tests/secp256k1/test_ecrecover.py --openvm-vectors guests/vectors.bin)
          out=$(docker run --rm -v "$PWD/guests:/n" "$OPENVM_IMAGE" /n/secp256k1-guest /n/vectors.bin | tail -1)
          echo "$out"
          [ "$out" = "public_values=$expected" ]             || { echo "::error::secp256k1 vectors failed: expected $expected"; exit 1; }

  run-divrem-vectors:
    name: Run division hints and arithmetic on OpenVM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-linux-gnu

      - name: Build the runner with the division hint
        run: docker build -t openvm-divrem-test runner

      - name: Execute the vectors
        run: bash tests/divrem/run.sh openvm-divrem-test

      # The u256 and secp256k1 jobs run the guests on this runner, the one
      # of this commit.
      - name: Save the runner image
        run: docker save openvm-divrem-test | gzip > openvm-runner.tar.gz

      - name: Upload the runner image
        uses: actions/upload-artifact@v7
        with:
          name: openvm-runner
          path: openvm-runner.tar.gz
          retention-days: 1

  build-nupkg:
    name: Build NuGet package
    needs: [build-libopenvm, run-divrem-vectors, run-secp256k1-guest, run-u256-vectors]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Download libopenvm artifact
        uses: actions/download-artifact@v8
        with:
          name: libopenvm

      - name: Move artifacts into the package project
        run: |
          mkdir -p src/runtime/runtimes/linux-riscv64/native
          mv libopenvm.a libopenvm.bflat.manifest openvm_entry.o openvm.ld openvm.bflat.manifest \
             src/runtime/runtimes/linux-riscv64/native/

      - name: Detect version
        id: version
        run: |
          # Version tag (v2.1.0, v2.2.0-rc.1): tag without v + .<run>
          # Commit hash: 0.0.0-dev-<short hash>.<run>
          # Branch: 0.0.0-dev-<branch>.<run>
          if [[ "$OPENVM_REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$OPENVM_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            version="0.0.0-dev-${OPENVM_REF:0:7}"
          else
            version="0.0.0-dev-$(printf '%s' "$OPENVM_REF" | tr -c '0-9A-Za-z-' '-')"
          fi
          version+=".${GITHUB_RUN_NUMBER}"
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      # A run that is run again keeps its run number, and with it the
      # version. Its publish jobs would replace the files of the release
      # that has the version already. Start a new run instead.
      - name: Check that the release does not exist
        if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ; then
            echo "::error::the release v$VERSION exists already: start a new run"
            exit 1
          fi

      - name: Inject openvm_ref and the package version into the manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for MANIFEST in src/runtime/runtimes/linux-riscv64/native/*.bflat.manifest ; do
            jq --arg ref "$OPENVM_REF" --arg version "$VERSION" \
              '.version = $version | .metadata.openvm_ref = $ref' \
              "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
          done

      - name: Pack
        working-directory: src/runtime
        run: |
          dotnet pack Nethermind.OpenVM.Runtime.csproj -c release \
            -p:Version=${{ steps.version.outputs.version }}

      # The lists of the package entries, for the sign job (docs/signing.md
      # in bflat-riscv64). This job has no key: the sign job signs the lists,
      # and the publish job adds the signatures to the package.
      - name: List the package entries
        working-directory: src/runtime
        run: python3 ../../scripts/sign_package.py list-nupkg ../../signature ./artifacts/package/release/*.nupkg

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-unsigned
          path: src/runtime/artifacts/package/release/*.nupkg
          if-no-files-found: error

      - name: Upload the lists
        uses: actions/upload-artifact@v7
        with:
          name: bflat-signature-lists
          path: signature/*.sha256
          if-no-files-found: error

  # The private key is only in the sign job, which runs no build
  # (docs/signing.md in bflat-riscv64).
  sign:
    name: Sign the package
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
    needs: build-nupkg
    permissions: {}
    uses: NethermindEth/bflat-riscv64/.github/workflows/sign.yml@34a3e73ad5b2f34a868f5793172dc4a3a97bf382 # master
    with:
      lists: bflat-signature-lists
    secrets:
      BFLAT_SIGNING_KEY: ${{ secrets.BFLAT_SIGNING_KEY }}

  publish-nupkg:
    name: Publish NuGet package
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_URL: ${{ inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
      NUGET_SOURCE: ${{ inputs.publish == 'Staging' && 'https://apiint.nugettest.org' || 'https://api.nuget.org' }}/v3/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Download nupkg artifact
        uses: actions/download-artifact@v8
        with:
          name: nupkg-unsigned
          path: nupkg

      - name: Download the signatures
        uses: actions/download-artifact@v8
        with:
          name: bflat-signatures
          path: signature

      # Each package must agree with the list that was signed, and the
      # signature must be valid for the public key, before the push.
      - name: Add the signatures
        env:
          BFLAT_SIGNING_PUBLIC_KEY: ${{ vars.BFLAT_SIGNING_PUBLIC_KEY }}
        run: python3 scripts/sign_package.py embed signature nupkg/*.nupkg

      - name: NuGet login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_URL }}
          token-service-url: ${{ env.NUGET_URL }}/api/v2/token

      - name: Publish NuGet package
        run: |
          dotnet nuget push nupkg/*.nupkg \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_SOURCE }}

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  publish-nupkg-github:
    name: Publish to GitHub
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
    needs: [build-nupkg, publish-nupkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download nupkg artifact
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Download libopenvm artifact
        uses: actions/download-artifact@v8
        with:
          name: libopenvm
          path: libopenvm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # The commit that was built; the default is the head of the default branch.
          target_commitish: ${{ github.sha }}
          tag_name: v${{ needs.build-nupkg.outputs.version }}
          name: Nethermind.OpenVM.Runtime ${{ needs.build-nupkg.outputs.version }}
          files: |
            nupkg/*.nupkg
            libopenvm/libopenvm.a
            libopenvm/libopenvm.bflat.manifest
            libopenvm/openvm_entry.o
            libopenvm/openvm.ld
            libopenvm/openvm.bflat.manifest
          body: |
            OpenVM zkVM accelerators for bflat guests.

            **Package**: `Nethermind.OpenVM.Runtime`
            **Version**: `${{ needs.build-nupkg.outputs.version }}`
            Built for OpenVM ref: `${{ env.OPENVM_REF }}`

            Implements the Keccak-256 and SHA-256 entry points of the eth-act
            zkVM accelerator standard on OpenVM's custom instructions.
          draft: false
          prerelease: ${{ contains(needs.build-nupkg.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
